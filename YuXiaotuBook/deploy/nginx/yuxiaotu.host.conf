# 宿主机 Nginx 配置（API / 交易走本机 127.0.0.1）
# 安装：sudo cp yuxiaotu.host.conf /etc/nginx/sites-available/yuxiaotu.conf
#       sudo ln -s /etc/nginx/sites-available/yuxiaotu.conf /etc/nginx/sites-enabled/
# 将 YOUR_DOMAIN 与 root 路径改成实际值后：sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN;

    root /usr/local/projects/yuxiaotu/app/YuXiaotuBook/frontend/dist;
    index index.html;

    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/orders {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/member {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /usr/local/projects/yuxiaotu/data/uploads/;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        output_buffers 2 1m;
        types {
            video/mp4 mp4;
            video/webm webm;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
        }
        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes always;
        add_header Content-Disposition "inline" always;
    }

    location ~ ^/media/v/homePage/(.+)$ {
        alias /usr/local/projects/yuxiaotu/data/uploads/homePage/$1.mp4;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        output_buffers 2 1m;
        default_type video/mp4;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes always;
        add_header Content-Disposition "inline" always;
    }

    location ~ ^/media/v/bookReview/(.+)$ {
        alias /usr/local/projects/yuxiaotu/data/uploads/bookReview/$1.mp4;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        output_buffers 2 1m;
        default_type video/mp4;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes always;
        add_header Content-Disposition "inline" always;
    }

    location /placeholders/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
