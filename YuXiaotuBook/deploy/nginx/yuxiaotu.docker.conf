# Docker Compose 内 Nginx 配置（upstream 使用服务名 api / trade）
# uploads 由 Nginx 直出 /var/www/uploads（见 docker-compose.prod.yml 挂载）

open_file_cache max=2000 inactive=30s;
open_file_cache_valid 60s;
open_file_cache_min_uses 1;
open_file_cache_errors on;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 128m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/orders {
        proxy_pass http://trade:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/member {
        proxy_pass http://trade:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 无扩展名流媒体地址（避免浏览器注入「下载」按钮），Nginx 直出比走 API 更省 CPU
    location ~ ^/media/v/homePage/(.+)$ {
        alias /var/www/uploads/homePage/$1.mp4;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        output_buffers 2 1m;
        default_type video/mp4;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes always;
        add_header Content-Disposition "inline" always;
    }

    location ~ ^/media/v/bookReview/(.+)$ {
        alias /var/www/uploads/bookReview/$1.mp4;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        output_buffers 2 1m;
        default_type video/mp4;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes always;
        add_header Content-Disposition "inline" always;
    }

    # 上传文件直出（视频/图片），开启 sendfile + Range 支持渐进播放
    location /uploads/ {
        alias /var/www/uploads/;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        output_buffers 2 1m;
        types {
            video/mp4 mp4;
            video/webm webm;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
        }
        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes always;
        add_header Content-Disposition "inline" always;
    }

    location /placeholders/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
